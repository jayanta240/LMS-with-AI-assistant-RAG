services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    env_file:
      - .env

    expose:
      - "8000"

    volumes:
      - certificates_data:/app/certificates

    restart: unless-stopped


  frontend:
    build:
      context: ./app
      dockerfile: Dockerfile

      args:
        NEXT_PUBLIC_API_URL: /api

    expose:
      - "3000"

    restart: unless-stopped


  nginx:
    image: nginx:alpine

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - frontend
      - backend

    restart: unless-stopped


volumes:
  certificates_data: